
name: Check Build in NodeJS Different Versions

on: [push, pull_request]

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build-vue3:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Build get-started-library/vue3
      run: |
        cd get-started-library/vue3
        npm install
        npm run build

    - name: Build get-started-creator/vue3
      run: |
        cd get-started-creator/vue3
        npm install
        npm run build

    - name: Build multi-page-survey/vue3
      run: |
        cd multi-page-survey/vue3
        npm install
        npm run build

    - name: Build quiz/vue3
      run: |
        cd quiz/vue3
        npm install
        npm run build

    - name: Build integrate-third-party-vue-components
      run: |
        cd integrate-third-party-vue-components
        npm install
        npm run build
    
  build-angular:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        project:
          - dashboard-table-view/angular
          - get-started-analytics/angular
          - get-started-creator/angular
          - get-started-creator/angular-standalone-components
          - get-started-library/angular
          - get-started-library/angular-standalone-components
          - get-started-pdf/angular
          - integrate-third-party-angular-components
          - multi-page-survey/angular
          - quiz/angular
          - survey-creator-web-service/angular
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production

  build-react-latest-dependencies:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build get-started-library/react
      run: |
        cd get-started-library/react
        npm install
        npm install survey-core
        npm run build

    - name: Build get-started-creator/react
      run: |
        cd get-started-creator/react
        npm install
        npm install survey-core survey-react-ui survey-creator-core
        npm run build

    - name: Build get-started-analytics/react
      run: |
        cd get-started-analytics/react
        npm install
        npm install survey-core
        npm run build

    - name: Build get-started-pdf/react
      run: |
        cd get-started-pdf/react
        npm install
        npm install survey-core
        npm run build

    - name: Build integrate-third-party-react-components
      run: |
        cd integrate-third-party-react-components
        npm install
        npm install survey-core survey-react-ui survey-creator-core
        npm run build

    - name: Build multi-page-survey/react
      run: |
        cd multi-page-survey/react
        npm install
        npm install survey-core
        npm run build

    - name: Build quiz/react
      run: |
        cd quiz/react
        npm install
        npm install survey-core
        npm run build

    - name: Build survey-creator-web-service/react
      run: |
        cd survey-creator-web-service/react
        npm install
        npm install survey-core survey-react-ui survey-creator-core
        npm run build

    - name: Build dashboard-table-view/react
      run: |
        cd dashboard-table-view/react
        npm install
        npm install survey-core
        npm run build
  
  build-react:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build get-started-library/react
      run: |
        cd get-started-library/react
        npm install
        npm run build

    - name: Build get-started-creator/react
      run: |
        cd get-started-creator/react
        npm install
        npm run build

    - name: Build get-started-analytics/react
      run: |
        cd get-started-analytics/react
        npm install
        npm run build

    - name: Build get-started-pdf/react
      run: |
        cd get-started-pdf/react
        npm install
        npm run build

    - name: Build integrate-third-party-react-components
      run: |
        cd integrate-third-party-react-components
        npm install
        npm run build

    - name: Build multi-page-survey/react
      run: |
        cd multi-page-survey/react
        npm install
        npm run build

    - name: Build quiz/react
      run: |
        cd quiz/react
        npm install
        npm run build

    - name: Build survey-creator-web-service/react
      run: |
        cd survey-creator-web-service/react
        npm install
        npm run build

    - name: Build dashboard-table-view/react
      run: |
        cd dashboard-table-view/react
        npm install
        npm run build
